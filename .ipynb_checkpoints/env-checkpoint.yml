name: wildlife_v100

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.10
  - pip

  # PyTorch and CUDA: managed by Conda
  - pytorch=2.7.1
  - torchvision=0.22.1
  - torchaudio=2.7.1
  - pytorch-cuda=11.8

  - pip:
      # Keep PyTorch versions fixed during pip dependency resolution
      - torch==2.7.1
      - torchvision==0.22.1
      - torchaudio==2.7.1

      - pytorchwildlife==1.3.0
      - ultralytics==8.4.70
      - supervision==0.23.0
      - timm==1.0.27
      - opencv-python==4.10.0.84
      - numpy==2.2.6
      - pandas==2.3.3
      - scikit-learn==1.7.2
      - matplotlib==3.10.9
      - seaborn==0.13.2
      - transformers==4.57.6