name: wildlife_v100

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.10
  - pip
  - setuptools>=68.0,<81.0
  - wheel

  # PyTorch and CUDA
  - pytorch=2.7.1
  - torchvision=0.22.1
  - torchaudio=2.7.1
  - pytorch-cuda=11.8

  # Scientific Python
  - numpy=2.2.6
  - pandas=2.3.3
  - scikit-learn=1.7.2
  - matplotlib=3.10.9
  - seaborn=0.13.2
  - pillow

  # Pip dependencies
  - pip:
      - pytorchwildlife==1.3.1
      - ultralytics==8.4.70
      - supervision==0.23.0
      - timm==1.0.27
      - opencv-python==4.10.0.84
      - transformers==4.57.6
      - soundfile
      - librosa
      - gradio>=4.44.1,<5
      - chardet
      - lightning
      - omegaconf
      - yolov5